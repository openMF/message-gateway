plugins {
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'idea'
    id 'eclipse'
    // Gradle license plugin switched to an obscure plugin
    // because the popular plugin stopped working with all recent gradle versions
    // https://github.com/hierynomus/license-gradle-plugin/issues/179
   // id 'org.cadixdev.licenser' version '0.6.1'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

if (project.hasProperty('profile')
        && project.getProperty('profile') == 'deployable') {
    apply from: 'profile-deployable.gradle'
} else {
    apply from: 'profile-standalone.gradle'
}

repositories {
    mavenCentral()
    // paymenthub-ee-bom lives on the official Mifos JFrog. The old
    // jfrog.sandbox.fynarfin.io entry is gone: the URL had a stray quote in it
    // and the repository itself no longer exists.
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
}

//license {
//    header = project.file('./LICENSE.md')
//    skipExistingHeaders = true
//    exclude '**/*.html'
//    exclude '**/*.mustache'
//    exclude '**/package-info.java'
//    exclude '**/keystore.jks'
//}

dependencies {
    // Pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10 and every other
    // shared library version. Do NOT hardcode managed versions.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 (required by Spring Boot 3.4) moved per-database support out of
    // flyway-core into its own module. The migrations in db/migration are MySQL.
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.json:json'
    // Three helper classes use StringUtils. It used to arrive transitively as
    // commons-lang 2.x (last released 2011) via the velocity dependency, which
    // nothing else uses. Declared directly as commons-lang3 instead.
    implementation 'org.apache.commons:commons-lang3'
    // gson and okhttp are imported directly by the code (gson in 8 files, okhttp
    // in JasminSMSProvider and CallbackEventListner) but used to arrive only as
    // transitives of the InfoBip SDK. Declared here so bumping or dropping an SMS
    // vendor cannot break unrelated classes. okhttp keeps its resolved 2.3.0: the
    // BOM does not manage it, and moving to okhttp3 is a source change.
    implementation 'com.google.code.gson:gson'
    implementation 'com.squareup.okhttp:okhttp:2.3.0'

    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-jackson-starter'
    implementation 'org.apache.camel:camel-endpointdsl'
    implementation 'org.apache.camel:camel-jetty'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel:camel-http'
    implementation 'io.camunda:zeebe-client-java'

    // SMS provider SDKs: not managed by the BOM, so these keep explicit versions.
    implementation 'com.twilio.sdk:twilio:7.1.0'
    implementation 'com.infobip:infobip-api-java-client:2.0.0'
    implementation 'com.telerivet:TelerivetAPIClient:1.7.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// spring-boot-starter-test ships JUnit 5; without this Gradle defaults to the
// JUnit 4 runner and silently skips every JUnit 5 test.
tasks.named('test') {
    useJUnitPlatform()
}

// Deterministic boot jar name so the Dockerfile can copy exactly one file
// (avoids the *.jar glob picking up the plain -plain.jar when `build` runs).
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

wrapper {
    gradleVersion = '8.10.2'
}
